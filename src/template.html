<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人资金看板</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfd; --line:#e5e8ec; --line2:#eef1f4;
  --text:#12161c; --muted:#69727f; --faint:#98a1ad;
  --pos:#0f9d58; --neg:#d93636; --accent:#2f6df6; --accent-soft:#eaf0ff;
  --cn:#0e9488; --hk:#e0803a; --stock:#7c5cd6;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1015; --panel:#151a21; --panel2:#1a2029; --line:#242c37; --line2:#1e252e;
    --text:#e8ecf1; --muted:#95a0ae; --faint:#6b7684;
    --pos:#3ecf8e; --neg:#ff6b6b; --accent:#5b8cff; --accent-soft:#1b2540;
    --cn:#2dd4bf; --hk:#ffa657; --stock:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1015; --panel:#151a21; --panel2:#1a2029; --line:#242c37; --line2:#1e252e;
  --text:#e8ecf1; --muted:#95a0ae; --faint:#6b7684;
  --pos:#3ecf8e; --neg:#ff6b6b; --accent:#5b8cff; --accent-soft:#1b2540;
  --cn:#2dd4bf; --hk:#ffa657; --stock:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 72px}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:650;font-size:15px;white-space:nowrap}
.brand span{color:var(--faint);font-weight:400;margin-left:8px;font-size:12px}
.spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 13px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input,button{font:inherit;color:inherit}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.ctl:hover{border-color:var(--faint)}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec-title{font-size:12px;font-weight:650;letter-spacing:.6px;color:var(--faint);margin:26px 0 10px}

.hero{display:grid;grid-template-columns:minmax(250px,1fr) 1.25fr;margin-top:20px;overflow:hidden}
.hero-main{padding:22px 24px;border-right:1px solid var(--line)}
.hero-lbl{font-size:12.5px;color:var(--muted)}
.hero-val{font-size:clamp(28px,5vw,42px);font-weight:680;letter-spacing:-1px;margin:4px 0 2px;line-height:1.12;font-variant-numeric:tabular-nums}
.hero-sub{font-size:12.5px;color:var(--faint)}
.hero-side{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;align-content:center}
.mini-lbl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mini-val{font-size:19px;font-weight:620;letter-spacing:-.3px;margin-top:2px;font-variant-numeric:tabular-nums}
.mini-sub{font-size:11px;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero-main{border-right:0;border-bottom:1px solid var(--line)}}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}}
.tile{padding:15px 16px}
.tile .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-size:20px;font-weight:640;letter-spacing:-.3px;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .d{font-size:11.5px;margin-top:3px;color:var(--faint);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.tblwrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:600;color:var(--faint);text-align:right;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
th:first-child{text-align:left}
td{padding:8px 14px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-variant-numeric:normal}
tbody tr:last-child td{border-bottom:0}
tr.grp td{background:var(--panel2);font-weight:650;font-size:12px;color:var(--muted);padding:7px 14px}
tr.sum td{font-weight:650;background:var(--panel2)}
.tag{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:6px}
.tag.warn{background:color-mix(in srgb,var(--hk) 20%,transparent);color:var(--hk)}
.muted{color:var(--muted)} .faint{color:var(--faint)}

input[type=text],input[type=number],input[type=date],input[type=month],select.inp{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%;
  text-align:right;font-variant-numeric:tabular-nums;outline:none;transition:border-color .12s,box-shadow .12s;
}
input:focus,select.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
td input{min-width:94px}
input.lft,select.inp{text-align:left}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 15px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid color-mix(in srgb,var(--neg) 35%,transparent)}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.stickyfoot{position:sticky;bottom:0;z-index:20;margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;box-shadow:0 -4px 20px -8px rgba(0,0,0,.18)}
.sf .k{font-size:11px;color:var(--muted)}
.sf .v{font-size:16px;font-weight:640;font-variant-numeric:tabular-nums}

.chartbox{padding:14px 6px 6px}
.chartgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:780px){.chartgrid{grid-template-columns:1fr}}
.panel{padding:14px 12px 8px}
.panel-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.panel-hd .dot{margin-right:6px}
.panel-val{font-size:16px;font-weight:640;color:var(--text);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.panel-dl{font-size:11.5px;font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 14px 10px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.empty{padding:44px;text-align:center;color:var(--faint)}
.notice{background:color-mix(in srgb,var(--hk) 12%,transparent);border:1px solid color-mix(in srgb,var(--hk) 30%,transparent);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-top:14px;line-height:1.6}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--text);padding:0;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);max-width:92vw}
dialog::backdrop{background:rgba(8,10,14,.5)}
.dlg{padding:20px 22px;min-width:min(420px,86vw)}
.dlg h3{margin:0 0 14px;font-size:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--panel2)}
#userBox{display:inline-flex;align-items:center;gap:6px}
.ubox{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 10px;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.ubox.local{color:var(--faint)}
.ubox.warn{color:var(--hk);border-color:color-mix(in srgb,var(--hk) 40%,transparent)}
.pbar{width:60px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block}
.pbar i{display:block;height:100%;background:var(--accent)}
.onboard{max-width:620px;margin:60px auto;text-align:center;padding:34px 30px}
.onboard h2{margin:0 0 8px;font-size:20px}
.onboard p{color:var(--muted);margin:0 0 22px;line-height:1.7}
.onboard .row{justify-content:center}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand">个人资金看板<span id="hdDate"></span></div>
    <div class="spacer"></div>
    <div class="tabs" id="tabs">
      <button data-tab="overview" class="on">概览</button>
      <button data-tab="entry">录入</button>
      <button data-tab="installments">分期</button>
      <button data-tab="accounts">账户</button>
    </div>
    <select id="monthSel" class="ctl"></select>
    <div class="seg" id="ccySeg">
      <button data-ccy="CNY" class="on">¥ 人民币</button>
      <button data-ccy="HKD">HK$ 港币</button>
    </div>
    <span id="userBox"></span>
    <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
    <button class="icon-btn" id="menuBtn" title="数据管理">⋯</button>
  </div>
</header>
<div class="wrap"><div id="view"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<input type="file" id="fileInput" accept="application/json" style="display:none">
<!--SCRIPTS-->
</body>
</html>
